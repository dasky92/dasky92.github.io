<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{appDisplayName}}</title>
  <link rel="stylesheet" href="{{assetPrefix}}assets/site.css">
  <script>(function(){try{var t=localStorage.getItem('verde-theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t);}catch(e){}})();</script>
</head>
<body>
  <div class="wrap">
    <header class="site-header">
      <h1>{{appDisplayName}}</h1>
      <p class="meta">{{chooseLanguageLabel}}</p>
      <button type="button" class="theme-toggle" data-theme-toggle aria-label="Toggle color theme" title="Toggle color theme"></button>
    </header>

    <ul class="lang-picker">
      {{localeLinks}}
    </ul>
  </div>
  <script>(function(){var btn=document.querySelector('[data-theme-toggle]');if(!btn)return;var mq=window.matchMedia('(prefers-color-scheme: dark)');var SUN='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>';var MOON='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>';function eff(){return document.documentElement.getAttribute('data-theme')||(mq.matches?'dark':'light');}function render(){var e=eff();btn.innerHTML=(e==='dark')?MOON:SUN;var to=e==='dark'?'light':'dark';btn.setAttribute('title','Switch to '+to+' theme');btn.setAttribute('aria-label','Switch to '+to+' theme');}btn.addEventListener('click',function(){var next=eff()==='dark'?'light':'dark';document.documentElement.setAttribute('data-theme',next);try{localStorage.setItem('verde-theme',next);}catch(e){}render();});try{mq.addEventListener('change',render);}catch(e){mq.addListener(render);}render();})();</script>
</body>
</html>
